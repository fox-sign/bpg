<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPG - BoardPlayGround</title>
<!-- ... existing code ... -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        /* Modern, high-contrast controls while preserving the existing game layout. */
        :root { color-scheme: dark; }
        button, input { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 3px; }
        header { box-shadow: 0 12px 36px rgba(0,0,0,.24); }
        .glass-panel { border-color: rgba(148,163,184,.16); background: rgba(15,23,42,.82); }
        .glass-card { border-color: rgba(148,163,184,.13); }
        .glass-card:hover { transform: translateY(-1px); }
        .board-cell { transition: filter .12s ease, background-color .12s ease; }
        .board-cell:hover { filter: brightness(1.13); }
        input { background-color: rgba(2,6,23,.72); }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(99, 102, 241, 0.3);
        }

        /* Modern Game Active Border Glow */
        .game-active {
            border-color: #6366f1 !important;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.15) 100%) !important;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4), inset 0 0 12px rgba(99, 102, 241, 0.2) !important;
        }

        /* Strict Grid & Cell Aspect Ratio Fixes */
        .board-grid-container {
            display: grid;
            width: 100%;
            width: min(96vw, calc(100svh - 230px));
            max-width: none;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            user-select: none;
            overflow: hidden;
        }

        .board-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            overflow: hidden;
            outline: none;
        }

        /* Othello Classic Felt Board */
        .board-othello {
            background: #15803d;
            border: 8px solid #052e16;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 16px;
        }

        /* Chess Wooden Board */
        .board-chess {
            border: 8px solid #3f2314;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 16px;
        }

        /* Shogi & Go Authentic Wood Board */
        .board-wood {
            background: #d49a5b;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 80%),
                linear-gradient(to right, rgba(0,0,0,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.06) 1px, transparent 1px);
            box-shadow: inset 0 0 40px rgba(92, 51, 23, 0.6), 0 15px 35px rgba(0,0,0,0.5);
            border: 8px solid #78350f;
            border-radius: 16px;
        }

        /* Vidro Glass Arena Board */
        .board-vidro {
            background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.98));
            border: 8px solid rgba(99, 102, 241, 0.4);
            box-shadow: inset 0 0 40px rgba(99, 102, 241, 0.25), 0 15px 35px rgba(0,0,0,0.7);
            border-radius: 20px;
        }

        /* Perfectly Round Discs for Othello & Go */
        .disc-black {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #475569, #0f172a 70%, #020617);
            box-shadow: 0 4px 8px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .disc-white {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #f1f5f9 60%, #cbd5e1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 -2px 3px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .disc-blue {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb 60%, #1e40af);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.6), inset 0 2px 3px rgba(255,255,255,0.4);
            flex-shrink: 0;
        }

        .disc-green {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a 60%, #166534);
            box-shadow: 0 4px 8px rgba(22, 163, 74, 0.6), inset 0 2px 3px rgba(255,255,255,0.4);
            flex-shrink: 0;
        }

        /* Glass Beads for Vidro */
        .glass-bead-red {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff8787, #e03131 60%, #801313);
            box-shadow: 0 6px 14px rgba(224, 49, 49, 0.6), inset 0 -3px 5px rgba(0,0,0,0.5), inset 0 3px 5px rgba(255,255,255,0.8);
            flex-shrink: 0;
        }

        .glass-bead-yellow {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe066, #f59f00 60%, #824708);
            box-shadow: 0 6px 14px rgba(245, 159, 0, 0.6), inset 0 -3px 5px rgba(0,0,0,0.5), inset 0 3px 5px rgba(255,255,255,0.8);
            flex-shrink: 0;
        }

        .glass-bead-blue {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #93c5fd, #3b82f6 60%, #1d4ed8);
            box-shadow: 0 6px 14px rgba(59, 130, 246, 0.6), inset 0 -3px 5px rgba(0,0,0,0.5), inset 0 3px 5px rgba(255,255,255,0.8);
            flex-shrink: 0;
        }

        .glass-bead-green {
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #86efac, #22c55e 60%, #15803d);
            box-shadow: 0 6px 14px rgba(34, 197, 94, 0.6), inset 0 -3px 5px rgba(0,0,0,0.5), inset 0 3px 5px rgba(255,255,255,0.8);
            flex-shrink: 0;
        }

        /* Absolute Move Candidate Marker (Prevents layout shift) */
        .move-dot-overlay {
            position: absolute;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            pointer-events: none;
            z-index: 10;
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    
        html.light-mode body{background:#eef2ff;color:#172033} html.light-mode .glass-panel{background:rgba(255,255,255,.94);border-color:#cbd5e1;color:#172033} html.light-mode .glass-card{background:#f8fafc;border-color:#cbd5e1} .board-cell{border:1px solid rgba(2,6,23,.55)!important} #boardContainer{width:100%} #boardContainer .board-grid-container{width:min(96vw,calc(100svh - 230px));max-width:none}
</style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-slate-800/80 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i data-lucide="gamepad-2" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                        BoardPlayGround
                    </h1>
                    <span class="text-[10px] font-semibold tracking-widest text-indigo-400 uppercase">BPG Web Arena</span>
                </div>
            </div>

            <!-- Quick Action Badges -->
            <div class="flex items-center gap-2">
                <button onclick="openP2PModal()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-bold transition flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">P2Pオンライン対戦</span>
                </button>
                <button onclick="openGuideModal()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-slate-300 text-xs font-bold transition flex items-center gap-1.5">
                    <i data-lucide="book-open" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span class="hidden sm:inline">ガイド</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container Layout -->
    <main class="flex-1 max-w-none w-full mx-auto p-2 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3">
        
        <!-- Left Column: Game Navigation & Game Setup Panel -->
        <div class="lg:col-span-3 flex flex-col gap-3">
            
            <!-- Game Title Card & Selector Grid -->
            <div class="glass-panel p-4 rounded-3xl flex flex-col gap-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-400 flex items-center gap-1.5">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i> ゲーム種目選択
                    </span>
                    <span class="text-[10px] bg-indigo-500/20 text-indigo-300 font-bold px-2 py-0.5 rounded-full border border-indigo-500/30">全8種目</span>
                </div>

                <!-- 8 Game Grid -->
                <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-2 gap-2">
                    <button onclick="switchGame('othello')" id="btn-othello" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-emerald-950 border border-emerald-700/50 flex items-center justify-center group-hover:scale-110 transition">
                            <div class="w-5 h-5 rounded-full disc-black"></div>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">オセロ</div>
                            <div class="text-[10px] text-slate-400">Reversi</div>
                        </div>
                    </button>

                    <button onclick="switchGame('chess')" id="btn-chess" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-indigo-950 border border-indigo-700/50 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition">
                            <i data-lucide="crown" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">チェス</div>
                            <div class="text-[10px] text-slate-400">Chess</div>
                        </div>
                    </button>

                    <button onclick="switchGame('shogi')" id="btn-shogi" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-amber-950/60 border border-amber-700/50 flex items-center justify-center text-amber-400 font-black text-sm group-hover:scale-110 transition">
                            王
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">将棋</div>
                            <div class="text-[10px] text-slate-400">Shogi</div>
                        </div>
                    </button>

                    <button onclick="switchGame('vidro')" id="btn-vidro" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-rose-950/60 border border-rose-700/50 flex items-center justify-center group-hover:scale-110 transition">
                            <div class="w-5 h-5 rounded-full glass-bead-red"></div>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">ビードロ</div>
                            <div class="text-[10px] text-slate-400">Vidro</div>
                        </div>
                    </button>

                    <button onclick="switchGame('go')" id="btn-go" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-emerald-950/60 border border-emerald-700/50 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition">
                            <i data-lucide="circle" class="w-4 h-4 fill-emerald-400"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">囲碁 (9路)</div>
                            <div class="text-[10px] text-slate-400">Go Board</div>
                        </div>
                    </button>

                    <button onclick="switchGame('tictactoe')" id="btn-tictactoe" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-pink-950/60 border border-pink-700/50 flex items-center justify-center text-pink-400 group-hover:scale-110 transition">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">○×ゲーム</div>
                            <div class="text-[10px] text-slate-400">Tic-Tac-Toe</div>
                        </div>
                    </button>

                    <button onclick="switchGame('gomoku')" id="btn-gomoku" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-purple-950/60 border border-purple-700/50 flex items-center justify-center text-purple-400 group-hover:scale-110 transition">
                            <i data-lucide="grid-3x3" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">五目並べ</div>
                            <div class="text-[10px] text-slate-400">Gomoku</div>
                        </div>
                    </button>

                    <button onclick="switchGame('quantum_gomoku')" id="btn-quantum_gomoku" class="game-select-btn p-3 rounded-2xl glass-card flex items-center gap-3 text-left group">
                        <div class="w-9 h-9 rounded-xl bg-cyan-950/60 border border-cyan-700/50 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition">
                            <i data-lucide="atom" class="w-5 h-5 animate-spin" style="animation-duration: 10s;"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white">量子五目</div>
                            <div class="text-[10px] text-slate-400">Quantum</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Game Control Settings Panel -->
            <div class="glass-panel p-4 rounded-3xl flex flex-col gap-4">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-400 flex items-center gap-1.5">
                        <i data-lucide="sliders" class="w-4 h-4"></i> 対戦設定
                    </span>
                    <button onclick="resetCurrentGame(true)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold border border-slate-700 transition flex items-center gap-1">
                        <i data-lucide="rotate-ccw" class="w-3 h-3"></i> リセット
                    </button>
                </div>

                <!-- Mode Select Buttons (1P, 2P, 4P) -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold text-slate-400">対戦モード</label>
                    <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-950/80 rounded-2xl border border-slate-800">
                        <button onclick="setPlayMode('1p')" id="mode-1p-btn" class="py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 bg-indigo-600 text-white shadow">
                            <i data-lucide="bot" class="w-3.5 h-3.5"></i> 1P (CPU)
                        </button>
                        <button onclick="setPlayMode('2p')" id="mode-2p-btn" class="py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 text-slate-400 hover:text-white">
                            <i data-lucide="users" class="w-3.5 h-3.5"></i> 2P (対人)
                        </button>
                        <button onclick="setPlayMode('4p')" id="mode-4p-btn" class="py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 text-slate-400 hover:text-white">
                            <i data-lucide="users-2" class="w-3.5 h-3.5"></i> 4P (4人)
                        </button>
                    </div>
                </div>

                <!-- CPU Difficulty Selector -->
                <div id="cpuDifficultyWrapper" class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold text-slate-400">CPUの強さ</label>
                    <label class="text-[11px] font-bold text-slate-400 flex justify-between"><span>CPUの強さ</span><span id="cpuDifficultyValue">5/10・戦術的</span></label>
                    <input id="cpuDifficultySlider" type="range" min="1" max="10" step="1" value="5" oninput="setCpuDifficulty(this.value)" class="w-full accent-indigo-500 cursor-pointer" aria-label="CPUの強さ 1〜10">
                    <div class="flex justify-between text-[10px] text-slate-500"><span>1・手加減</span><span>10・極めて強い</span></div>
                </div>

                <!-- Player Side / Color Pick -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold text-slate-400">あなたの番・コマ色</label>
                    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-950/80 rounded-2xl border border-slate-800">
                        <button onclick="setPlayerSide('black')" id="side-black-btn" class="py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-white border border-slate-700 transition">先手 (黒/赤/P1)</button>
                        <button onclick="setPlayerSide('white')" id="side-white-btn" class="py-1.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition">後手 (白/黄/P2)</button>
                    </div>
                </div>
            </div>

            <!-- Active Log & Chat Panel -->
            <div class="glass-panel p-4 rounded-3xl flex flex-col gap-3 flex-1 min-h-[220px]">
                <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-400 flex items-center gap-1.5">
                        <i data-lucide="message-square" class="w-4 h-4"></i> 棋譜・チャットログ
                    </span>
                    <span id="p2pStatusBadge" class="text-[10px] font-bold text-slate-500 bg-slate-900 px-2 py-0.5 rounded-full border border-slate-800">ローカル対戦中</span>
                </div>

                <!-- Chat & Move History List -->
                <div id="gameLogBox" class="flex-1 overflow-y-auto max-h-[160px] text-xs space-y-1.5 p-2 bg-slate-950/80 rounded-2xl border border-slate-800 font-mono text-slate-300">
                    <div class="text-slate-500 italic text-[11px]">BoardPlayGround へようこそ！ゲームを選択して対戦を開始してください。</div>
                </div>

                <!-- Chat Input Form -->
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="メッセージを入力..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
                    <button onclick="sendChatMessage()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- Right Column: Main Playfield & Turn Status Banner -->
        <div class="lg:col-span-9 flex flex-col gap-3">
            
            <!-- Turn & Game Header Banner -->
            <div class="glass-panel p-4 rounded-3xl flex items-center justify-between shadow-2xl relative overflow-hidden">
                <div class="flex items-center gap-3">

    <!-- Rules & Guide Modal -->
    <div id="guideModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel border border-slate-800 p-6 rounded-3xl max-w-lg w-full max-h-[85vh] flex flex-col gap-3 shadow-2xl">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">

                <button onclick="closeGuideModal()" class="text-slate-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="guideContentBody" class="flex-1 overflow-y-auto text-xs text-slate-300 leading-relaxed space-y-3 p-2 bg-slate-950/60 rounded-2xl border border-slate-800">
                <!-- Guide text dynamically updated -->
            </div>
